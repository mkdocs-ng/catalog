# Regenerates README.md from projects.yaml every week and publishes the result
# straight to main, with a tag and a release. A sanity check stops the update
# if the generator lost most of its data (e.g. GitHub API failures).
name: update-best-of-list

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only generate and check; don't commit or release"
        type: boolean
        default: false
      generator_ref:
        description: "best-of-generator branch or tag to install"
        required: false
        default: "main"
  schedule:
    - cron: "0 18 * * 4" # Every Thursday at 6pm UTC

permissions:
  contents: write

concurrency:
  group: update-best-of-list
  cancel-in-progress: false

jobs:
  update-best-of-list:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick version
        run: |
          VERSION=$(date -u '+%Y.%m.%d')
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            VERSION=$(date -u '+%Y.%m.%d-%H.%M')
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "HISTORY_DATE=$(date -u '+%Y-%m-%d')" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install best-of-generator
        run: pip install "git+https://github.com/mkdocs-ng/best-of-generator@${GENERATOR_REF}"
        env:
          GENERATOR_REF: ${{ inputs.generator_ref || 'main' }}

      - name: Generate
        run: |
          cp README.md "$RUNNER_TEMP/README.old.md"
          best-of generate projects.yaml --github-key="$GITHUB_KEY" --libraries-key="$LIBRARIES_KEY"
        env:
          # A personal access token in BEST_OF_GITHUB_TOKEN gets a higher API
          # rate limit; the workflow token works too, just more slowly.
          GITHUB_KEY: ${{ secrets.BEST_OF_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          LIBRARIES_KEY: ${{ secrets.LIBRARIES_KEY }}

      - name: Check the result
        run: |
          python .github/scripts/check_update.py \
            "$RUNNER_TEMP/README.old.md" README.md \
            "$(ls history/*_projects.csv | sort | tail -n 1)"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: best-of-update-${{ env.VERSION }}
          path: |
            README.md
            latest-changes.md
            history/${{ env.HISTORY_DATE }}_*
          if-no-files-found: ignore

      - name: Commit, tag and push
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md latest-changes.md history/
          git commit -m "Update best-of list for version $VERSION"
          # main may have moved during the run; the generated files rarely conflict.
          git pull --rebase origin main
          git tag "$VERSION"
          git push origin HEAD:main "refs/tags/$VERSION"

      - name: Publish release
        if: ${{ !inputs.dry_run }}
        run: |
          gh release create "$VERSION" --title "Update: $VERSION" --notes-file latest-changes.md
        env:
          GH_TOKEN: ${{ github.token }}
