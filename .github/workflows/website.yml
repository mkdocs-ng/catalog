# Builds the catalog website (https://catalog.mkdocs-ng.org/) with
# MkDocs NG and Sumi, and publishes it to GitHub Pages.
#
# The weekly update pushes with the workflow token, which doesn't start other
# workflows, so this one also runs when update-best-of-list finishes.
name: website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "projects.yaml"
      - "history/**"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"
      - "projects.yaml"
      - ".github/workflows/website.yml"
  workflow_run:
    workflows: [update-best-of-list]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r website/requirements.txt
      - run: python website/generate.py
      - run: mkdocs build --strict -f website/mkdocs.yml
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: website/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
