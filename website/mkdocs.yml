# The pages in docs/ are generated by generate.py from projects.yaml and the
# newest history/*_projects.csv. Build locally with:
#
#   python website/generate.py && mkdocs serve -f website/mkdocs.yml
site_name: MkDocs Catalog
site_description: Plugins, themes and Markdown extensions for MkDocs NG and MkDocs, ranked and updated every week.
site_url: https://catalog.mkdocs-ng.org/
repo_url: https://github.com/mkdocs-ng/catalog
repo_name: mkdocs-ng/catalog
edit_uri: ""
copyright: Copyright &copy; 2026 The MkDocs NG contributors · CC-BY-SA-4.0

theme:
  name: sumi
  # The letterless book reads at header size; logo.svg (with M | NG) is for large uses.
  logo: img/logo-mark.svg
  logo_dark: img/logo-mark-dark.svg
  favicon: img/favicon.svg
  # Shown when a page is shared on social media.
  social_image: img/social.png
  # MkDocs NG brand blue; css/extra.css sets a lighter blue for dark mode.
  accent: "#0061fe"
  footer_links:
    - title: Catalog
      links:
        - {text: Categories, link: "/#categories"}
        - {text: All projects, link: all/}
        - {text: Tested on MkDocs NG, link: ng-tested/}
    - title: Contribute
      links:
        - {text: Add a project, link: "https://github.com/mkdocs-ng/catalog/edit/main/projects.yaml"}
        - {text: Suggest a project, link: "https://github.com/mkdocs-ng/catalog/issues/new/choose"}
        - {text: Source on GitHub, link: "https://github.com/mkdocs-ng/catalog"}
    - title: MkDocs NG
      links:
        - {text: Documentation, link: "https://mkdocs-ng.org/"}
        - {text: Switching from MkDocs, link: "https://mkdocs-ng.org/user-guide/migrating/"}
        - {text: Sumi theme, link: "https://sumi.mkdocs-ng.org/"}

extra_css:
  - css/extra.css

extra_javascript:
  - js/catalog.js

# Keeps the generated project pages (plugins/) out of the sidebar.
hooks:
  - hooks.py

plugins:
  - search
  - llms_txt:
      full_output: true
  - sumi:
      assistant_links: [claude, chatgpt]

markdown_extensions:
  - toc:
      permalink: "#"

extra:
  social:
    - icon: brand-github
      link: https://github.com/mkdocs-ng/catalog
      name: GitHub
    - icon: brand-python
      link: https://mkdocs-ng.org/
      name: MkDocs NG
