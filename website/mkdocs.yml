# The pages in docs/ are generated by generate.py from projects.yaml and the
# newest history/*_projects.csv. Build locally with:
#
#   python website/generate.py && mkdocs serve -f website/mkdocs.yml
site_name: MkDocs Catalog
site_description: Plugins, themes and Markdown extensions for MkDocs NG and MkDocs, ranked and updated every week.
site_url: https://catalog.mkdocs-ng.org/
repo_url: https://github.com/mkdocs-ng/catalog
repo_name: mkdocs-ng/catalog
edit_uri: ""
copyright: Copyright &copy; 2026 The MkDocs NG contributors · CC-BY-SA-4.0

theme:
  name: sumi
  logo: img/logo.svg
  logo_dark: img/logo-dark.svg
  favicon: img/favicon.svg
  # MkDocs NG brand blue; css/extra.css sets a lighter blue for dark mode.
  accent: "#0061fe"

extra_css:
  - css/extra.css

extra_javascript:
  - js/catalog.js

# Keeps the generated project pages (plugins/) out of the sidebar.
hooks:
  - hooks.py

plugins:
  - search
  - llms_txt:
      full_output: true
  - sumi:
      assistant_links: [claude, chatgpt]

markdown_extensions:
  - toc:
      permalink: "#"

extra:
  social:
    - icon: brand-github
      link: https://github.com/mkdocs-ng/catalog
      name: GitHub
    - icon: brand-python
      link: https://mkdocs-ng.org/
      name: MkDocs NG
